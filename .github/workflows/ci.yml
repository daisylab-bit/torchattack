name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install the project's dev dependencies
        # run: uv sync --dev --all-extras --all-groups
        run: uv sync --dev --all-extras --group test

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check . --output-format=github

      - name: Run type checking
        run: uvx ty check torchattack --output-format=github

      # - name: Run tests
      #   run: uv run pytest tests
